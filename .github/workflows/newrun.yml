name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          path: main

      - name: Checkout builds branch
        uses: actions/checkout@v4
        with:
          ref: builds
          path: builds

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Plugins
        working-directory: main
        run: |
          # Detect Android SDK path on GitHub Actions ubuntu-latest runner
          SDK_PATH=""
          for p in "$ANDROID_HOME" "$ANDROID_SDK_ROOT" \
                   "/usr/local/lib/android/sdk" \
                   "/home/runner/android-sdk" \
                   "/opt/android-sdk"; do
            if [ -n "$p" ] && [ -d "$p/platforms" ]; then
              SDK_PATH="$p"
              break
            fi
          done

          if [ -z "$SDK_PATH" ]; then
            SDK_PATH=$(find /usr /home /opt -maxdepth 6 -name "platforms" 2>/dev/null | grep -i android | head -n1 | xargs dirname 2>/dev/null || true)
          fi

          echo "=== SDK Path: $SDK_PATH ==="

          # Write local.properties WITH the found SDK path
          echo "sdk.dir=$SDK_PATH" > local.properties
          cat local.properties

          # Accept licenses
          yes | "$SDK_PATH/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true

          chmod +x gradlew
          ./gradlew make makePluginsJson --stacktrace

      - name: Collect artifacts and generate plugins.json
        run: |
          BUILD_DIR="$GITHUB_WORKSPACE/builds"
          SRC_DIR="$GITHUB_WORKSPACE/main"

          # Clean builds dir (keep .git folder)
          find "$BUILD_DIR" -mindepth 1 -not -path "$BUILD_DIR/.git/*" -not -name ".git" -delete 2>/dev/null || true

          # Copy all .cs3 plugin files
          find "$SRC_DIR" -type f -name "*.cs3" -exec cp -fv {} "$BUILD_DIR/" \; || true

          # Copy Gradle-generated plugins.json or generate fallback
          python3 "$SRC_DIR/.github/scripts/generate_plugins_json.py"

          echo "=== builds dir content ==="
          ls -la "$BUILD_DIR/"

      - name: Push to builds branch
        working-directory: builds
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git status
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "Build ${{ github.sha }}"
          git push origin builds