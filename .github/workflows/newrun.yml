name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          path: main

      - name: Checkout builds branch
        uses: actions/checkout@v4
        with:
          ref: builds
          path: builds

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Plugins
        working-directory: main
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew make makePluginsJson --stacktrace

      - name: Collect artifacts and generate plugins.json
        run: |
          BUILD_DIR="$GITHUB_WORKSPACE/builds"
          SRC_DIR="$GITHUB_WORKSPACE/main"

          # Clean builds dir (keep .git folder)
          find "$BUILD_DIR" -mindepth 1 -not -path "$BUILD_DIR/.git/*" -not -name ".git" -delete 2>/dev/null || true

          # Copy all .cs3 plugin files
          find "$SRC_DIR" -type f -name "*.cs3" -exec cp -fv {} "$BUILD_DIR/" \; || true

          # Copy Gradle-generated plugins.json or generate fallback
          python3 "$SRC_DIR/.github/scripts/generate_plugins_json.py"

          echo "=== builds dir content ==="
          ls -la "$BUILD_DIR/"

      - name: Push to builds branch
        working-directory: builds
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git status
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "Build ${{ github.sha }}"
          git push origin builds