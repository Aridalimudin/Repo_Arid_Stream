name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          path: main

      - name: Checkout builds branch
        uses: actions/checkout@v4
        with:
          ref: builds
          path: builds

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Plugins
        working-directory: main
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew make makePluginsJson --continue --stacktrace || true
          
          echo "=== Cleaning builds directory ==="
          cd $GITHUB_WORKSPACE/builds
          git rm -rf . 2>/dev/null || true
          cd $GITHUB_WORKSPACE/main

          echo "=== Copying cs3 plugins to builds ==="
          find . -type f -name "*.cs3" -exec cp -fv {} $GITHUB_WORKSPACE/builds/ \; || true

          echo "=== Copying or generating plugins.json ==="
          if [ -f build/plugins.json ]; then
            cp -fv build/plugins.json $GITHUB_WORKSPACE/builds/plugins.json
          else
            echo "build/plugins.json not found by Gradle task, running Python fallback generator..."
            python3 -c "
import os, json

entries = []
for root, dirs, files in os.walk('.'):
    for f in files:
        if f == 'plugin-entry.json':
            path = os.path.join(root, f)
            try:
                with open(path, 'r', encoding='utf-8') as fp:
                    data = json.load(fp)
                    entries.append(data)
                    print(f'Added plugin entry: {data.get(\"name\")}')
            except Exception as e:
                print(f'Error reading {path}: {e}')

out_path = os.path.join(os.environ.get('GITHUB_WORKSPACE', ''), 'builds', 'plugins.json')
with open(out_path, 'w', encoding='utf-8') as fp:
    json.dump(entries, fp, indent=2)
print(f'Generated plugins.json with {len(entries)} plugins at {out_path}')
"
          fi

      - name: Push to builds branch
        working-directory: builds
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git status
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "Build ${{ github.sha }}"
          git push origin builds