name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          path: main

      - name: Checkout builds branch
        uses: actions/checkout@v4
        with:
          ref: builds
          path: builds

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Find Android SDK path and set local.properties
        working-directory: main
        run: |
          # Find real Android SDK path on this runner
          echo "=== ANDROID_HOME=$ANDROID_HOME ==="
          echo "=== ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT ==="

          # Try multiple known locations for GitHub ubuntu-latest runner
          SDK_PATH=""
          for p in "$ANDROID_HOME" "$ANDROID_SDK_ROOT" \
                   "/usr/local/lib/android/sdk" \
                   "/home/runner/android-sdk" \
                   "/opt/android-sdk"; do
            if [ -n "$p" ] && [ -d "$p/platforms" ]; then
              SDK_PATH="$p"
              echo "Found SDK at: $SDK_PATH"
              break
            fi
          done

          if [ -z "$SDK_PATH" ]; then
            echo "SDK not found in known paths. Searching..."
            SDK_PATH=$(find /usr /home /opt -name "platforms" -path "*/android*" 2>/dev/null | head -n1 | xargs dirname || true)
            echo "Found via search: $SDK_PATH"
          fi

          if [ -z "$SDK_PATH" ]; then
            echo "ERROR: Could not find Android SDK!"
            exit 1
          fi

          echo "Using SDK at: $SDK_PATH"
          echo "sdk.dir=$SDK_PATH" > local.properties
          cat local.properties

          # Also export for rest of step
          echo "ANDROID_HOME=$SDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_PATH" >> $GITHUB_ENV

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || \
          yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Build Plugins
        working-directory: main
        run: |
          chmod +x gradlew
          ./gradlew make makePluginsJson --stacktrace

      - name: Collect artifacts and generate plugins.json
        run: |
          BUILD_DIR="$GITHUB_WORKSPACE/builds"
          SRC_DIR="$GITHUB_WORKSPACE/main"

          # Clean builds dir (keep .git folder)
          find "$BUILD_DIR" -mindepth 1 -not -path "$BUILD_DIR/.git/*" -not -name ".git" -delete 2>/dev/null || true

          # Copy all .cs3 plugin files
          find "$SRC_DIR" -type f -name "*.cs3" -exec cp -fv {} "$BUILD_DIR/" \; || true

          # Copy Gradle-generated plugins.json or generate fallback
          python3 "$SRC_DIR/.github/scripts/generate_plugins_json.py"

          echo "=== builds dir content ==="
          ls -la "$BUILD_DIR/"

      - name: Push to builds branch
        working-directory: builds
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git status
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "Build ${{ github.sha }}"
          git push origin builds