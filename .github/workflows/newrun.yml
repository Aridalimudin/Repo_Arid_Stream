name: Build

concurrency:
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Checkout builds
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds"

      - name: Clean old builds
        run: rm $GITHUB_WORKSPACE/builds/*.cs3 2>/dev/null || true

      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: "adopt"
          java-version: 11

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Build Plugins
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew make makePluginsJson
          cp -f **/build/*.cs3 $GITHUB_WORKSPACE/builds/ 2>/dev/null || true
          cp -f build/plugins.json $GITHUB_WORKSPACE/builds/plugins.json 2>/dev/null || true

      - name: Generate plugins.json fallback
        run: |
          if [ ! -s "$GITHUB_WORKSPACE/builds/plugins.json" ]; then
            python3 "$GITHUB_WORKSPACE/src/.github/scripts/generate_plugins_json.py"
          fi

      - name: Push to builds branch
        working-directory: builds
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git status
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "Build ${{ github.sha }}"
          git push origin builds