name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          path: main

      - name: Checkout builds branch
        uses: actions/checkout@v4
        with:
          ref: builds
          path: builds

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Plugins
        run: |
          cd main
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew makePluginsJson --continue || true
          cp -f build/*.cs3 ../builds/ 2>/dev/null || true
          cp -f build/plugins.json ../builds/ 2>/dev/null || true
          find . -name "*.cs3" -exec cp -f {} ../builds/ \; 2>/dev/null || true

      - name: Push to builds branch
        run: |
          cd builds
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -f .
          git commit -m "Build ${{ github.sha }}" || exit 0
          git push