name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: main
          path: main

      - name: Checkout builds branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: builds
          path: main/builds

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Plugins
        run: |
          cd main
          touch local.properties
          chmod +x gradlew
          ./gradlew makePluginsJson --info --continue 2>&1 | tail -200
          find . -name "*.cs3" | xargs -I{} cp {} builds/ 2>/dev/null || true
          cp build/plugins.json builds/ 2>/dev/null || true

      - name: Push to builds branch
        run: |
          cd main/builds
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Build ${{ github.sha }}" || exit 0
          git push