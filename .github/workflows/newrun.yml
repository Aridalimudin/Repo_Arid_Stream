name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          path: main

      - name: Checkout builds branch
        uses: actions/checkout@v4
        with:
          ref: builds
          path: builds

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Plugins
        working-directory: main
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew makePluginsJson --continue || true
          echo "=== Cari plugins.json ==="
          find . -name "plugins.json" 2>/dev/null
          echo "=== Cari cs3 ==="
          find . -name "*.cs3" 2>/dev/null
          echo "=== Copy files ==="
          cp build/plugins.json $GITHUB_WORKSPACE/builds/plugins.json 2>/dev/null || echo "plugins.json not found in build/"
          cp **/build/*.cs3 $GITHUB_WORKSPACE/builds/ 2>/dev/null || echo "no cs3 files"
          find . -name "*.cs3" -exec cp {} $GITHUB_WORKSPACE/builds/ \; 2>/dev/null || true

      - name: Push to builds branch
        working-directory: builds
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -f .
          git status
          git commit -m "Build ${{ github.sha }}" || echo "Nothing to commit"
          git push